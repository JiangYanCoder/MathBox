name: Release

# 触发方式：
#   1. 推送形如 1.2.3 的 tag（推荐，版本以 tag 为准）
#      —— **不带 v 前缀**，且必须与 manifest.json 的 version 完全一致；
#      Obsidian 更新器与社区目录按 tag / 版本字面匹配
#   2. 仓库页面 Actions → Release → Run workflow，手动触发
#      （版本号取自 manifest.json，tag 即版本号本身）
on:
    push:
        tags:
            - '[0-9]+.[0-9]+.[0-9]+*'
    workflow_dispatch:
        inputs:
            draft:
                description: '创建为草稿（不立即对外发布）'
                type: boolean
                required: false
                default: false
            prerelease:
                description: '标记为预发布版本'
                type: boolean
                required: false
                default: false

permissions:
    contents: write

jobs:
    release:
        name: 构建并发布 Release
        runs-on: ubuntu-latest
        timeout-minutes: 15

        steps:
            - uses: actions/checkout@v6
              with:
                  # 手动触发时 checkout 默认分支；tag 触发时自动 checkout 该 tag
                  fetch-depth: 0

            - name: 使用 Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '24'
                  cache: 'npm'

            # npm ci 依赖 package-lock.json 与仓库严格一致，不可改用 npm install
            - name: 安装依赖
              run: npm ci

            # ---------- 1. 解析并校验版本号 ----------
            - name: 解析版本号并校验与 manifest 一致
              id: ver
              run: |
                  set -euo pipefail
                  MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"
                  echo "manifest.json version = ${MANIFEST_VERSION}"

                  if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
                    TAG="${GITHUB_REF_NAME}"
                  else
                    # 手动触发：以 manifest.json 为准，tag 即版本号本身（不带 v）
                    TAG="${MANIFEST_VERSION}"
                  fi

                  # tag 必须与 manifest 版本完全一致，且不带 v 前缀
                  if [ "${TAG}" != "${MANIFEST_VERSION}" ]; then
                    echo "::error::tag (${TAG}) 与 manifest.json 版本 (${MANIFEST_VERSION}) 不一致；请去掉 tag 的 v 前缀，或先同步 manifest.json 再打 tag"
                    exit 1
                  fi

                  echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
                  echo "version=${TAG}" >> "$GITHUB_OUTPUT"

            # ---------- 2. 构建 ----------
            # npm run build = tsc 类型检查 + esbuild 生产构建 + 体积门禁（≤150 KB）
            - name: 构建插件
              run: npm run build

            # ---------- 3. 校验发布产物 ----------
            # 只允许 main.js / manifest.json / styles.css 进入 Release；
            # data.json（运行期设置，含用户收藏）、src、node_modules、
            # esbuild.config.mjs、.gitignore 等一律不发布。
            - name: 校验发布产物
              run: |
                  set -euo pipefail
                  for f in main.js manifest.json styles.css; do
                    if [ ! -f "$f" ]; then
                      echo "::error::缺少必需产物 ${f}"
                      exit 1
                    fi
                  done
                  # data.json 属运行期设置，显式确认它不在上传清单中
                  echo "将上传（且仅上传）以下三个文件："
                  printf '  %s\n' main.js manifest.json styles.css
                  du -h main.js manifest.json styles.css

            # ---------- 4. 生成 Release 说明（tag 说明作为 release body）----------
            - name: 生成 release body
              id: notes
              run: |
                  set -euo pipefail
                  NOTES="$(mktemp)"
                  {
                    echo "## MathBox ${{ steps.ver.outputs.version }}"
                    echo
                    echo "提交：\`$(git log -1 --pretty=%h)\` — $(git log -1 --pretty=%s)"
                    echo
                    echo "### 本次变更"
                    echo
                    echo '```'
                    git log -1 --pretty=%B
                    echo '```'
                    echo
                    echo "### 安装"
                    echo
                    echo "1. 下载下方 \`main.js\`、\`manifest.json\`、\`styles.css\` 三个文件"
                    echo "2. 在 vault 的 \`<vault>/.obsidian/plugins/obsidian-math-box/\` 创建同名文件夹"
                    echo "   （文件夹名必须与 \`manifest.json\` 的 \`id\` 完全一致）"
                    echo "3. 把三个文件放入该文件夹"
                    echo "4. 重启 Obsidian，或在「第三方插件」中重新开启 MathBox"
                  } > "$NOTES"
                  echo "path=${NOTES}" >> "$GITHUB_OUTPUT"

            # ---------- 5. 创建或更新 GitHub Release（上传三个产物）----------
            - name: 创建或更新 GitHub Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAG: ${{ steps.ver.outputs.tag }}
                  VERSION: ${{ steps.ver.outputs.version }}
                  NOTES: ${{ steps.notes.outputs.path }}
                  DRAFT: ${{ inputs.draft || false }}
                  PRERELEASE: ${{ inputs.prerelease || false }}
              run: |
                  set -euo pipefail
                  # 注意：--draft / --prerelease 是布尔开关（Go pflag），必须写成
                  # --flag=<值> 形式。写成 `--draft "$DRAFT"` 会被解析成「--draft 为真
                  # + 多出一个名为 false 的位置参数」，而 gh release create 的位置参数
                  # 被当作待上传文件 —— 于是它去打开名为 false 的文件，报
                  # no such file or directory 并立刻退出（首次打 tag 就是挂在这里）。
                  echo "tag=${TAG} draft=${DRAFT} prerelease=${PRERELEASE}"

                  if gh release view "$TAG" >/dev/null 2>&1; then
                    # 已存在 → **就地更新，绝不删除**。
                    #
                    # 为什么不能"先删后建"：在网页点 Publish 时 GitHub 才会创建 tag，
                    # 而"创建 tag"对 Actions 就是一个 push 事件 → 本工作流会再次触发。
                    # 若走删除路径，就等于把一个刚刚发布成功的 Release 先删掉再重建；
                    # 一旦删除之后那一步失败，用户会落到"只剩 tag、没有 Release"的状态，
                    # 而且正好发生在他以为已经发布成功之后。
                    #
                    # 就地更新不做三件事：不改 draft / prerelease 状态（本次运行无权
                    # 把一个已发布的 Release 打回草稿），不动 tag 指向，不重置下载计数。
                    echo "::notice::tag ${TAG} 已有 Release，就地更新资产与说明（不删除）"
                    gh release upload "$TAG" main.js manifest.json styles.css --clobber
                    gh release edit "$TAG" \
                      --title "MathBox ${VERSION}" \
                      --notes-file "$NOTES"
                  else
                    gh release create "$TAG" \
                      --title "MathBox ${VERSION}" \
                      --notes-file "$NOTES" \
                      --draft="$DRAFT" \
                      --prerelease="$PRERELEASE" \
                      main.js manifest.json styles.css
                    echo "::notice::Release ${TAG} 创建成功"
                  fi

            # ---------- 6. 输出 BR 安装信息 ----------
            - name: 输出 BR 安装信息
              if: always()
              env:
                  TAG: ${{ steps.ver.outputs.tag }}
                  REPO: ${{ github.repository }}
              run: |
                  {
                    echo "### BR（Beta Raply）用户安装方式"
                    echo
                    echo "| 项 | 取值 |"
                    echo "| --- | --- |"
                    echo "| 仓库 | \`${REPO}\` |"
                    echo "| Release 标签 | \`${TAG}\` |"
                    echo "| 下载文件 | \`main.js\`、\`manifest.json\`、\`styles.css\` |"
                  } >> "$GITHUB_STEP_SUMMARY"
